<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Workspace Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .score-section {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .current-score {
            font-size: 1.5em;
            font-weight: bold;
            color: #4285f4;
        }

        .last-change {
            background: #e3f2fd;
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid #2196f3;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .last-change:hover {
            background: #bbdefb;
            transform: translateY(-2px);
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            overflow-x: auto;
        }

        .tab {
            padding: 15px 25px;
            background: #f8f9fa;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-weight: 500;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .tab.active {
            background: #4285f4;
            color: white;
        }

        .tab-content {
            display: none;
            padding: 30px;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
        }

        .question-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #4285f4;
        }

        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #333;
            line-height: 1.6;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        .option {
            padding: 15px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .option:hover {
            border-color: #4285f4;
            background: #f0f8ff;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e8;
        }

        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .feedback {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 500;
            text-align: center;
        }

        .feedback.correct {
            background: #e8f5e8;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
            border: 2px solid #f44336;
        }

        .feedback.validation-error {
            background: #fff3e0;
            color: #e65100;
            border: 2px solid #ff9800;
        }

        .next-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            background: #3367d6;
            transform: translateY(-2px);
        }

        .history-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .history-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .history-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 4px solid;
        }

        .history-correct {
            background: #e8f5e8;
            border-left-color: #4caf50;
        }

        .history-incorrect {
            background: #ffebee;
            border-left-color: #f44336;
        }

        .checkbox-option {
            /* display: flex; */
            align-items: center;
            gap: 10px;
        }

        .checkbox-option.selected {
            background: #e3f2fd;
            border-color: #2196f3;
        }

        .checkbox-custom {
            font-size: 1.2em;
            color: #666;
        }

        .matching-table {
            margin: 20px 0;
            overflow-x: auto;
        }

        .matching-table table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .matching-table th {
            background: #4285f4;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: 500;
        }

        .matching-table td {
            padding: 12px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }

        .statement-cell {
            background: #f5f5f5;
            font-weight: 500;
            text-align: left !important;
        }

        .matching-cell {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .matching-cell:hover {
            background: #e3f2fd;
        }

        .matching-cell.selected {
            background: #bbdefb;
        }

        .matching-cell.correct {
            background: #e8f5e8;
        }

        .matching-cell.incorrect {
            background: #ffebee;
        }

        .matching-indicator {
            font-size: 1.2em;
            color: #666;
        }

        .matching-cell.selected .matching-indicator {
            color: #2196f3;
            content: "●";
        }

        .matching-cell.correct .matching-indicator {
            color: #4caf50;
            content: "✓";
        }

        .matching-cell.incorrect .matching-indicator {
            color: #f44336;
            content: "✗";
        }

        .highlight-keyword {
            background-color: #fff3cd;
            color: black;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                padding-left: 5px;
                padding-right: 5px;
            }

            .header h1 {
                font-size: 2em;
            }

            .score-section {
                flex-direction: column;
                gap: 15px;
            }

            .tabs {
                flex-wrap: nowrap;
            }

            .tab-content {
                padding: 10px;
            }

            .options {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding-left: 5px;
                padding-right: 5px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .current-score {
                font-size: 1.2em;
            }

            .last-change {
                font-size: 0.9em;
            }

            .tab {
                padding: 12px 18px;
            }
        }
    </style>
</head>

            tabs.forEach(tab => tab.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // Update URL with tab parameter
            const url = new URL(window.location);
            url.searchParams.set('tab', tabName);
            window.history.pushState({}, '', url);

            if (tabName === 'random') {

            currentQuestions[appName] = shuffledQuestions;
            currentQuestionIndex[appName] = 0;

            displayQuestion(appName);

        function selectOption(appName, selectedIndex, selectedOption) {
            const questions = currentQuestions[appName];
            const currentIndex = currentQuestionIndex[appName];
            const question = questions[currentIndex];

            const options = document.querySelectorAll(`#${appName} .option`);
            const correctAnswer = question.options[question.correct];

            let isCorrect = false;
            options.forEach((option, index) => {
                if (question.answer_options && question.answer_options[index]) {
                    option.innerHTML = question.answer_options[index];
                }

                if (option.textContent.trim() === correctAnswer) {
                    if (index === selectedIndex) {
                        isCorrect = true;
                    }
                    option.classList.add('correct');
                } else if (index === selectedIndex) {
                    option.classList.add('incorrect');
                }
                option.style.pointerEvents = 'none';
            });


            if (question.answer_question) {
                const questionElement = document.querySelector(`#${appName} .question`);
                questionElement.innerHTML = question.answer_question;
            }

            if (question.answer_criteria) {
                const headerCells = document.querySelectorAll(`#${appName} .matching-table th`);
                headerCells.forEach((th, index) => {
                    if (question.answer_criteria[index]) {
                        th.innerHTML = question.answer_criteria[index];
                    }
                });

                statementCells.forEach((td, index) => {
                    if (question.answer_options[index]) {
                        td.innerHTML = question.answer_options[index];
                    }

            }

            const scoreChange = isCorrect ? 1 : -2;
            currentScore += scoreChange;
            document.getElementById('score').textContent = currentScore;

            const feedback = document.getElementById(`feedback-${appName}`);
            if (isCorrect) {

            // Clear all selections in the same row and column
            const allCells = document.querySelectorAll(`#${appName} .matching-cell`);
            allCells.forEach(c => {
                if (c.getAttribute('data-row') == row || c.getAttribute('data-col') == col) {
                    c.classList.remove('selected');
                    c.querySelector('.matching-indicator').textContent = '○';
                }
            });

            // Toggle current cell
            if (cell.classList.contains('selected')) {
                cell.classList.remove('selected');
                indicator.textContent = '○';
            } else {
                cell.classList.add('selected');
                indicator.textContent = '●';
            }
        }

            const isCorrect = question.correct.length === userSelections.length &&
                             question.correct.every(correctMatch =>
                                 userSelections.some(userMatch =>
                                     userMatch.row === correctMatch.row && userMatch.col === correctMatch.col
                                 )
                             );

            const allCells = document.querySelectorAll(`#${appName} .matching-cell`);
            allCells.forEach(cell => {
                const row = parseInt(cell.getAttribute('data-row'));
                const col = parseInt(cell.getAttribute('data-col'));
                const indicator = cell.querySelector('.matching-indicator');

                const isCorrectMatch = question.correct.some(match => match.row === row && match.col === col);
                const isUserSelection = userSelections.some(selection => selection.row === row && selection.col === col);

                if (isCorrectMatch) {
                    cell.classList.add('correct');
                    indicator.textContent = '✓';
                } else if (isUserSelection) {
                    cell.classList.add('incorrect');
                    indicator.textContent = '✗';
                }
                cell.style.pointerEvents = 'none';
            });

            if (question.answer_question) {
                const questionElement = document.querySelector(`#${appName} .question`);
                questionElement.innerHTML = question.answer_question;
            }

            if (question.answer_criteria) {
                const headerCells = document.querySelectorAll(`#${appName} .matching-table th`);
                headerCells.forEach((th, index) => {
                    if (question.answer_criteria[index]) {
                        th.innerHTML = question.answer_criteria[index];
                    }
                });
            }

            if (question.answer_options) {
                const statementCells = document.querySelectorAll(`#${appName} .matching-table .statement-cell`);
                statementCells.forEach((td, index) => {
                    if (question.answer_options[index]) {
                        td.innerHTML = question.answer_options[index];
                    }
                });
            }

            const scoreChange = isCorrect ? 1 : -2;
            currentScore += scoreChange;
            document.getElementById('score').textContent = currentScore;

            const feedback = document.getElementById(`feedback-${appName}`);
            if (isCorrect) {
                const message = encouragementMessages[Math.floor(Math.random() * encouragementMessages.length)];
                feedback.textContent = `✅ Correct! ${message}`;
                feedback.className = 'feedback correct';
            } else {
                const message = motivationMessages[Math.floor(Math.random() * motivationMessages.length)];
                feedback.textContent = `❌ Incorrect. ${message}`;
                feedback.className = 'feedback incorrect';
            }
                        feedback.style.display = 'block';

            document.getElementById(`submit-${appName}`).style.display = 'none';
            document.getElementById(`next-${appName}`).style.display = 'block';

            // Add Try Again button for incorrect answers
            if (!isCorrect) {
                const tryAgainBtn = document.createElement('button');
                tryAgainBtn.className = 'next-btn try-again-btn';
                tryAgainBtn.style.marginLeft = '10px';
                tryAgainBtn.style.background = '#ff9800';
                tryAgainBtn.onclick = () => retryQuestion(appName);
                tryAgainBtn.textContent = 'Try Again';
                document.getElementById(`next-${appName}`).parentNode.insertBefore(tryAgainBtn, document.getElementById(`next-${appName}`).nextSibling);
            }

            const historyEntry = {
                app: appName,
                question: question.question,
                userAnswer: userSelections.map(s => `${question.options[s.row]} → ${question.criteria[s.col]}`).join(', '),
                correctAnswer: question.correct.map(c => `${question.options[c.row]} → ${question.criteria[c.col]}`).join(', '),
                isCorrect: isCorrect,
                scoreChange: scoreChange,
                timestamp: new Date().toLocaleString()
            };
            scoreHistory.push(historyEntry);

            const changeText = isCorrect ? `+1 (Correct)` : `-2 (Incorrect)`;
            document.getElementById('lastChange').textContent = changeText;
        }

        function nextQuestion(appName) {
            if (appName === 'random') {
                loadRandomQuestion();
            } else {
                currentQuestionIndex[appName]++;
                displayQuestion(appName);
            }
        }

        function retryQuestion(appName) {
            // Remove any existing Try Again buttons
            const existingTryAgainBtn = document.querySelector(`#${appName} .try-again-btn`);
            if (existingTryAgainBtn) {
                existingTryAgainBtn.remove();
            }

            // Reset the current question without moving to the next one
            displayQuestion(appName);
        }

        function showHistory() {
            const modal = document.getElementById('historyModal');
            const historyList = document.getElementById('historyList');

            if (scoreHistory.length === 0) {
                historyList.innerHTML = '<p>No history yet. Start answering questions to see your progress!</p>';
            } else {
                historyList.innerHTML = scoreHistory.map(entry => `
                    <div class="history-item ${entry.isCorrect ? 'history-correct' : 'history-incorrect'}">
                        <strong>${entry.app.toUpperCase()}</strong> - ${entry.timestamp}<br>
                        <strong>Question:</strong> ${entry.question}<br>
                        <strong>Your Answer:</strong> ${entry.userAnswer}<br>
                        <strong>Correct Answer:</strong> ${entry.correctAnswer}<br>
                        <strong>Score Change:</strong> ${entry.scoreChange > 0 ? '+' : ''}${entry.scoreChange}
                    </div>
                `).join('');
            }

            modal.style.display = 'block';
        }

        function hideHistory() {
            document.getElementById('historyModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('historyModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

                window.onload = function() {
            // Hide tabs that don't have questions
            hideEmptyTabs();

            // Check for tab parameter in URL
            const urlParams = new URLSearchParams(window.location.search);
            const tabParam = urlParams.get('tab');

            if (tabParam) {
                const tabButton = document.querySelector(`.tab[onclick*="'${tabParam}'"]`);
                if (tabButton) {
                    tabButton.click();
                }
            } else {
                // Default to first available tab
                const firstAvailableTab = getFirstAvailableTab();
                if (firstAvailableTab) {
                    const tabButton = document.querySelector(`.tab[onclick*="'${firstAvailableTab}'"]`);
                    if (tabButton) {
                        tabButton.click();
                    }
                }
            }
        };

        function hideEmptyTabs() {
            const tabButtons = document.querySelectorAll('.tab');
            tabButtons.forEach(tabButton => {
                const tabName = tabButton.getAttribute('onclick').match(/showTab\('([^']+)'\)/)[1];
                if (tabName !== 'random' && (!quizData[tabName] || quizData[tabName].length === 0)) {
                    tabButton.style.display = 'none';
                }
            });
        }

        function getFirstAvailableTab() {
            const tabButtons = document.querySelectorAll('.tab');
            for (let tabButton of tabButtons) {
                if (tabButton.style.display !== 'none') {
                    const tabName = tabButton.getAttribute('onclick').match(/showTab\('([^']+)'\)/)[1];
                    if (quizData[tabName] && quizData[tabName].length > 0) {
                        return tabName;
                    }
                }
            }
            return null;
        }

    </script>
</body>
</html>
